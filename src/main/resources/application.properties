spring.application.name=validus-backend
spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:validus;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.settings.trace=false
logging.level.com.validus.backend=INFO
security.mock=true
storage.root=./storage
ai.base-url=http://localhost:8081/ai
ai.api-key=changeme
ai.timeout-ms=5000
resilience4j.circuitbreaker.instances.ai.register-health-indicator=true
resilience4j.circuitbreaker.instances.ai.sliding-window-size=10
resilience4j.circuitbreaker.instances.ai.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ai.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.ai.max-attempts=3
resilience4j.retry.instances.ai.wait-duration=500ms
management.endpoints.web.exposure.include=health,info
